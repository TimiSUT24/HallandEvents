name: Daily Scraper

on:
  schedule:
    - cron: "0 4 * * *" # Runs daily at 06:00 UTC
  workflow_dispatch: # Optional: allows manual run

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: WebScrapeSecrets

    strategy:
        fail-fast: false
        matrix:
            scraper: 
             - scrapeFBG.js
             - scrapeVBG.js
             - scrapeHSTD.js
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Run scraper
        run: node ${{ matrix.scraper }}

      - name: Upload scraper result
        uses: actions/upload-artifact@v4
        with:
          name: events-${{ matrix.scraper }}
          path: "*.json"


  merge-and-upload:
    runs-on: ubuntu-latest
    needs: scrape
    if: always()

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download scraper artifacts
        uses: actions/download-artifact@v4
        with:
          path: events

      - name: Move JSON files
        run: |
          find events -name "*.json" -exec mv {} . \;

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Merge events
        run: node mergeEvents.js

      - name: Upload events
        env:
          Upload_API_URL: ${{ secrets.Upload_API_URL }}
          UploadEventsKey: ${{ secrets.UploadEventsKey }}
        run: node uploadEvents.js
